# std: libc++'s named module; LIBCXX_MODULES_DIR is set by Dependencies.cmake.
name = "std_module"
extra_module_interfaces =["${LIBCXX_MODULES_DIR}/std.cppm"]
# The two warnings std.cppm trips are about its own spelling.
private_options = ["-Wno-reserved-module-identifier", "-Wno-include-angled-in-module-purview"]
